services:
  server:
    build: .
    image: danbooru-to-your-heroine
    # ComfyUIがホスト(127.0.0.1)やLAN内で動いている場合、host networkが最も簡単（Linux専用）。
    # Mac/Windows等host network非対応の環境では下のnetwork_modeを削除し、
    # ports: ["8899:8899"] を有効化した上でconfig.yamlのapi_hostを"0.0.0.0"にすること。
    network_mode: host
    volumes:
      - ./src/config.yaml:/app/src/config.yaml:ro
      - ./database:/app/database
      # config.yamlのoutput_dir/web_output_dirと同じ絶対パスでホスト側ディレクトリをマウントする（例）
      # - /mnt/external_hdd/generated_images:/mnt/external_hdd/generated_images
    restart: unless-stopped

