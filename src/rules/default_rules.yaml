# default_rules.yaml
# ==================
# 全ユーザー共通の公式Baseルール辞書（Git管理対象）。
# 画像の品質向上や属性衝突回避のための普遍的なタグ分類リスト。
# git pull で常に最新の改善が配信される。

# プロンプトから無条件で削るメタタグ（投稿管理用など）
meta_purge:
  - bad pixiv id
  - bad id
  - bad twitter id
  - bad deviantart id
  - bad nicoseiga id
  - bad tumblr id
  - bad source id
  - translated
  - translation request
  - partial translation
  - check translation
  - commentary
  - commentary request
  - commentary typo
  - check commentary
  - partial commentary
  - dated commentary
  - english commentary
  - chinese commentary
  - korean commentary
  - japanese commentary
  - copyright request
  - personification
  - character request
  - artist request
  - photoshop (medium)
  - duplicate
  - revision
  - resized
  - non-web source
  - third-party edit
  - third-party source
  - patreon username
  - deviantart username
  - twitter username
  - pixiv username
  - username
  - web address
  - url
  - logo

# プロンプトから削る画面ノイズ・透かし・文字ゴミタグ（convenient censoring等のフェチタグは保持）
artifact_purge:
  - mosaic censoring
  - bar censor
  - character censor
  - censored text
  - artist name
  - copyright name
  - cover
  - cover name
  - content rating
  - signature
  - watermark
  - cover page
  - doujin cover
  - speech bubble
  - thought bubble
  - sound effect
  - sound effects
  - colored speech bubble
  - character age
  - english text
  - engrish text
  - chinese text
  - korean text
  - japanese text
  - alt text
  - sample text

# 品質タグ（モデル標準やプロンプト構築時に制御）

quality_tags:
  - masterpiece
  - best quality
  - high quality
  - ultra quality
  - highly detailed
  - detailed
  - absurdres
  - highres
  - 4k
  - 8k
  - hdr

