<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>danbooru-to-your-heroine ビューア</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header>
  <h1>danbooru-to-your-heroine</h1>
  <p class="subtitle">生成履歴を確認し、そのまま再生成できるビューア</p>
  <div id="comfy-status" class="comfy-status"></div>
</header>

<main>
  <section id="generate-form" class="panel">
    <h2>新規生成</h2>
    <form id="form">
      <label>
        Danbooru投稿URL
        <input type="url" id="f-url" placeholder="https://danbooru.donmai.us/posts/12345" required>
      </label>
      <div class="form-row">
        <label>
          ヒロイン
          <select id="f-heroine"></select>
        </label>
        <label>
          バックエンド
          <select id="f-backend"></select>
        </label>
        <label>
          artistタグ
          <select id="f-artist-mode">
            <option value="none">除去(none)</option>
            <option value="keep">元投稿優先(keep)</option>
            <option value="override">ヒロイン固定(override)</option>
          </select>
        </label>
        <label>
          artist自由記述（指定時は上の選択より優先）
          <input type="text" id="f-custom-artist" placeholder="例: wlop（\"artist:\"は省略可）">
        </label>
      </div>
      <div class="form-row">
        <button type="button" id="f-preview-btn" class="secondary">プロンプトをプレビュー</button>
      </div>
      <label>
        プロンプト（プレビュー後に編集可。空のままなら自動生成された内容をそのまま使う）
        <textarea id="f-prompt" rows="3" placeholder="「プロンプトをプレビュー」を押すと変換結果がここに表示される"></textarea>
      </label>
      <button type="submit" id="f-submit">生成する</button>
    </form>
    <p id="form-status" class="status"></p>
  </section>

  <section id="batch-panel" class="panel">
    <h2>自動バッチ生成</h2>
    <p class="hint">検索条件に合致する投稿を裏で自動生成し続ける（重複はmanifestで自動回避）。手動生成は常にこれより優先される。</p>
    <form id="batch-form">
      <label>
        Danbooru検索クエリ
        <input type="text" id="b-search" placeholder="order:score rating:explicit micro_bikini" required>
      </label>
      <div class="form-row">
        <label>
          ヒロイン
          <select id="b-heroine"></select>
        </label>
        <label>
          バックエンド
          <select id="b-backend"></select>
        </label>
        <label>
          artistタグ
          <select id="b-artist-mode">
            <option value="none">除去(none)</option>
            <option value="keep">元投稿優先(keep)</option>
            <option value="override">ヒロイン固定(override)</option>
          </select>
        </label>
        <label>
          artist自由記述（指定時は上の選択より優先）
          <input type="text" id="b-custom-artist" placeholder="例: wlop（\"artist:\"は省略可）">
        </label>
        <label>
          並び順
          <select id="b-sort">
            <option value="">新着順（デフォルト）</option>
            <option value="score">スコア順</option>
            <option value="favcount">お気に入り数順</option>
            <option value="rank">ランク順</option>
          </select>
        </label>
      </div>
      <div class="form-row">
        <label class="checkbox">
          <input type="checkbox" id="b-lucky">
          🍀 I'm Feeling Lucky（並び順を無視してランダム抽出を無限ループ）
        </label>
      </div>
      <div class="form-row">
        <button type="submit" id="b-start-btn">バッチ開始</button>
        <button type="button" id="b-stop-btn" class="secondary" disabled>停止</button>
      </div>
    </form>
    <p id="batch-status" class="status"></p>
  </section>

  <section class="panel">
    <div class="gallery-header">
      <h2>生成履歴</h2>
      <button id="reload-btn" type="button">再読み込み</button>
    </div>
    <div class="form-row">
      <label>
        ヒロイン絞り込み
        <select id="filter-heroine">
          <option value="">すべて</option>
        </select>
      </label>
      <label>
        モデル絞り込み
        <select id="filter-model">
          <option value="">すべて</option>
          <option value="illustrious">illustrious</option>
          <option value="anima">anima</option>
        </select>
      </label>
      <label>
        期間(開始)
        <input type="date" id="filter-date-from">
      </label>
      <label>
        期間(終了)
        <input type="date" id="filter-date-to">
      </label>
      <label>
        タグ絞り込み(複数可)
        <select id="filter-tag-select">
          <option value="">タグを選択して追加</option>
        </select>
      </label>
      <button type="button" id="filter-apply-btn">絞り込む</button>
      <button type="button" id="filter-reset-btn" class="secondary">リセット</button>
    </div>
    <div id="filter-tag-chips" class="tag-chips"></div>
    <div id="gallery" class="gallery"></div>
    <div class="load-more-row">
      <button type="button" id="load-more-btn" class="secondary hidden">もっと見る</button>
      <span id="gallery-count" class="status"></span>
    </div>
  </section>
</main>

<div id="lightbox" class="lightbox hidden">
  <button type="button" id="lightbox-close" class="lightbox-close" aria-label="閉じる">×</button>
  <img id="lightbox-img" src="" alt="拡大表示">
</div>

<script src="app.js"></script>
</body>
</html>
